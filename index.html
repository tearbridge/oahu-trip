<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>欧胡岛 12/12–12/18 行程</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{--ink:#1f2a30;--mut:#6b7780;--line:#dfe5e8;--bg:#f6f8f9;--sea:#0e7490;--land:#b45309;--car:#be123c;--ok:#15803d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
#map{position:fixed;top:0;left:0;right:0;height:42vh;z-index:1}
#panel{position:absolute;top:42vh;left:0;right:0;bottom:0;overflow:auto;background:var(--bg);z-index:2;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .c{color:var(--car);margin-left:3px}.tab.on .c{color:#fda4af}
.wrap{padding:10px 12px;max-width:720px;margin:0 auto}
h2{font-size:19px;margin:6px 0 2px}
.sub{color:var(--mut);font-size:13px}
.badges{margin:6px 0}
.b{display:inline-block;white-space:nowrap;font-size:12px;border-radius:10px;padding:1px 8px;margin:0 4px 4px 0;border:1px solid}
.b.land{color:var(--land);border-color:var(--land)}.b.sea{color:var(--sea);border-color:var(--sea)}
.b.car{color:#fff;background:var(--car);border-color:var(--car)}.b.nocar{color:var(--ok);border-color:var(--ok)}.b.opt{color:#a16207;border-color:#a16207}.b.pick{color:#fff;background:#9f1239;border-color:#9f1239}
.stop{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:8px 0;cursor:pointer}
.stop.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.st-h{display:flex;gap:8px;align-items:baseline}
.t{font-weight:700;font-size:14px;white-space:nowrap;min-width:4.8em}
.n{font-weight:700;font-size:15px;flex:1}
.num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:none}
.st-b{font-size:13.5px;line-height:1.6;margin-top:4px}
.st-b .k{color:var(--mut)}
.bring{font-size:13px;background:#f1f5f9;border-radius:6px;padding:4px 8px;margin-top:4px}
.warn{font-size:13px;background:#fff7ed;border-radius:6px;padding:4px 8px;margin-top:4px;color:#9a3412}
.drive{font-size:12.5px;color:var(--mut);margin:-2px 0 0 30px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.65}
.box h3{margin:0 0 4px;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.pin{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.hotel{background:#111;width:26px;height:26px;border-radius:6px;font-size:14px}
.foot{font-size:12px;color:var(--mut);margin-top:14px}
@media(min-width:900px){#map{right:auto;width:58vw;height:100vh}#panel{top:0;left:58vw}}
.leaflet-control-layers{font-size:12px;padding:2px 6px;border-radius:8px}.leaflet-control-layers label{margin:2px 0}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="tabs"></div>
  <div class="wrap" id="day"></div>
</div>
<script src="vendor/leaflet.js"></script>
<script>
const HOTEL=[21.2766,-157.8250];
const P={
 hnl:["檀香山机场 HNL",21.3245,-157.9251],
 lux:["Kalakaua 大道品牌店 · T Galleria",21.2797,-157.8297],
 ala:["Ala Moana Center",21.2910,-157.8436],
 dh:["钻石头山",21.2620,-157.8060],
 ph:["珍珠港",21.3676,-157.9390],
 pali:["Pali 观景台",21.3667,-157.7933],
 kua:["Kualoa 牧场",21.5208,-157.8370],
 gio:["Giovanni's 虾车（Kahuku）",21.6797,-157.9476],
 lani:["Laniakea 海滩",21.6190,-158.0850],
 hal:["Haleiwa 小镇",21.5928,-158.1031],
 halh:["Haleiwa 港 · 鲨鱼笼",21.5960,-158.1045],
 han:["恐龙湾 Hanauma Bay",21.2690,-157.6940],
 kew:["Kewalo 港（浮潜船集合点之一）",21.2930,-157.8560],
 tc:["Turtle Canyon",21.2700,-157.8400],
 rh:["Royal Hawaiian Center · International Market Place",21.2795,-157.8290],
 dq:["唐吉诃德 Don Quijote",21.2906,-157.8340],
 kap:["牡丹虾晚餐（餐厅待定）",21.2790,-157.8130]
};
const DAYS=[
{d:"12/12",w:"周六",title:"抵达 · Waikiki 逛街",type:["land"],car:"no",carNote:"机场到酒店叫 Uber XL，三个人加行李，约 25 分钟。",
 stops:[
  {p:"hnl",t:"11:00",txt:"我们的航班 11:00 落地。妈妈的国际航班同一天上午到，出关大约需要 1 到 1.5 小时，在到达层会合。",bring:"妈妈：护照、美国签证、EVUS 登记记录、回程行程单。",warn:"妈妈的航班确定后，再核对会合时间。"},
  {p:"hotel",t:"12:30",txt:"到酒店先寄存行李，15:00 起可以入住。积分房入住时，可以和前台确认免收 resort fee。"},
  {p:"lux",t:"13:30",txt:"Kalakaua 大道上的品牌店和 T Galleria 免税店，从酒店步行几分钟就到。",bring:"护照（免税店可能需要出示）、好走的鞋。"},
  {p:"ala",t:"16:00",txt:"Ala Moana Center，夏威夷最大的商场，打车约 5 分钟。"},
  {p:"hotel",t:"18:30",txt:"晚饭安排早一些。刚到的第一天，傍晚通常最容易犯困。"}]},
{d:"12/13",w:"周日",title:"钻石头山日出 · 珍珠港",type:["land"],car:"pick",carNote:"钻石头山打车约 10 分钟。上午在 Waikiki 门店取车，下午自驾去珍珠港。",
 stops:[
  {p:"hotel",t:"05:40",txt:"出发去钻石头山。刚到的头两天容易早醒，正好去看日出。"},
  {p:"dh",t:"06:00",txt:"按预约时段入园，登顶约 40 分钟，大部分是上坡和台阶。12 月的日出在 7:00 前后，8:30 左右下山。",bring:"预约二维码、手电或头灯、饮用水、运动鞋、薄外套（山顶早上风大）。",warn:"需要预约。12/13 的名额在 11/13 开放（提前 30 天）。"},
  {p:"hotel",t:"09:00",txt:"回酒店吃早饭、休息，上午去门店取车。"},
  {p:"ph",t:"13:00",txt:"珍珠港亚利桑那号纪念馆，按票面时间提前 30 分钟到。整个参观约 2 到 3 小时。",bring:"手机、钱包、证件。",warn:"园区不允许带包入内（包括背包和相机包），门口有付费寄存。"},
  {p:"hotel",t:"17:00",txt:"回 Waikiki。第二天出发很早，晚饭后早些休息。"}]},
{d:"12/14",w:"周一",title:"北岸鲨鱼笼 · Kualoa 牧场",type:["sea","land"],car:"yes",carNote:"全天自驾，绕岛北半圈：先走 H2 去北岸，再沿东岸回来，开车合计约 2.5 小时。",
 stops:[
  {p:"hotel",t:"05:45",txt:"出发去北岸，车程约 1 小时。"},
  {p:"halh",t:"06:45",txt:"Haleiwa 港签到，出海约 2 小时。人在笼子里，浮在水面附近，不需要会潜水。",bring:"晕船药（出发前 1 小时服用）、泳衣穿在里面、毛巾、一套干衣服、reef-safe 防晒、运动相机。",warn:"12 月北岸浪大，出海可能临时取消。预订时选可以免费改期的商家，取消了就改到 12/17。"},
  {p:"hal",t:"09:30",txt:"上岸后在 Haleiwa 小镇吃早午饭，可以尝尝 Matsumoto 刨冰。"},
  {p:"lani",t:"10:45",txt:"Laniakea 海滩，常有海龟上岸休息，在岸上就能看到。",warn:"与海龟保持 3 米以上的距离。这里是路边停车，过马路注意来车。"},
  {p:"gio",t:"12:00",txt:"Giovanni's 虾车吃午饭，招牌是蒜蓉虾。",warn:"饭点可能要排队半小时左右。"},
  {p:"kua",t:"13:30",txt:"Kualoa 牧场 UTV 越野车，提前 30 分钟签到，行程约 2 小时，会经过《侏罗纪公园》等电影的拍摄地。",bring:"驾照（开车的人）、深色旧衣服（会溅泥）、墨镜、头绳、薄外套。",warn:"选 14:00 左右开始的场次，具体以官网为准。"},
  {p:"pali",t:"16:45",txt:"回程经过 Pali 观景台，看东岸的山崖，停留 15 分钟左右。",bring:"外套（风很大）、停车费（可刷卡）。"},
  {p:"hotel",t:"17:30",txt:"回到酒店。这一天起得早，晚饭在附近简单吃。"}]},
{d:"12/15",w:"周二",title:"Turtle Canyon 看海龟",type:["sea"],car:"no",carNote:"浮潜船在 Waikiki 附近集合，不少商家提供酒店接送。车停在酒店。",
 stops:[
  {p:"kew",t:"08:00",txt:"Turtle Canyon 浮潜团。上午风浪较小、水更清。船程约 15 分钟，全程 2 到 3 小时。",bring:"晕船药、泳衣、毛巾、reef-safe 防晒。船上会提供面镜，自带的更贴合。",warn:"集合地点以订单为准。"},
  {p:"tc",t:"08:30",txt:"海龟常在这片礁石附近休息、觅食，浮在水面上就能看到。请不要触碰。"},
  {p:"rh",t:"14:00",txt:"下午回酒店休息，或者去 Royal Hawaiian Center 和 International Market Place，都在步行范围内。"},
  {p:"hotel",t:"18:00",txt:"晚上在 Kalakaua 大道散步。"}]},
{d:"12/16",w:"周三",title:"恐龙湾浮潜",type:["sea"],car:"yes",carNote:"开车约 25 分钟，回来后中午还车。",
 stops:[
  {p:"hotel",t:"06:45",txt:"出发去恐龙湾。"},
  {p:"han",t:"07:15",txt:"按预约时段入园，先看一段十几分钟的保育短片，再步行下坡到海滩（也有付费接驳车）。浮潜到 11 点左右。",bring:"预约确认和证件、门票（每人约 $25）、面镜和呼吸管、水鞋、reef-safe 防晒、毛巾、饮用水。",warn:"每周一、二闭园。12/16 的名额在 12/14 夏威夷时间 7:00 开放预约。停车位少，尽量早到。"},
  {p:"hotel",t:"12:00",txt:"回 Waikiki 还车。"},
  {p:"dq",t:"14:00",txt:"下午去唐吉诃德买零食和伴手礼。"}]},
{d:"12/17",w:"周四",title:"自由活动 · 牡丹虾晚餐",type:["land"],car:"no",carNote:"如果鲨鱼笼改到今天，需要再租一天车，或者选含 Waikiki 接送的团。",
 stops:[
  {p:"hotel",t:"09:00",txt:"备用日。12/14 的鲨鱼笼如果因为风浪取消，就改到今天。没有改期的话，今天自由安排：海滩、泳池，或者再逛一次商场。"},
  {p:"ala",t:"14:00",txt:"想补买东西的话，可以再去一趟 Ala Moana。"},
  {p:"kap",t:"18:30",txt:"晚饭吃牡丹虾（botan ebi），寿司店或 omakase。",warn:"餐厅待定。订位时确认当天有没有牡丹虾。"}]},
{d:"12/18",w:"周五",title:"返程",type:["land"],car:"no",carNote:"叫 Uber XL 去机场，约 25 分钟。",
 stops:[
  {p:"hotel",t:"08:00",txt:"早饭后买些伴手礼，11:00 前退房，行李寄存在前台。退房时核对一下积分房的账单。"},
  {p:"hnl",t:"11:30",txt:"出发去机场。我们的航班 13:43 起飞，20:50 到 SJC。妈妈的回国航班建议选中午到下午起飞的，可以一起去机场。",bring:"妈妈的护照；液体放托运；提前在 App 上值机。"}]}
];
const BOOK=[
 ["已开放","珍珠港（12/13 下午）","提前 8 周开放，10/18 起可订；名额满了的话，前一天还会放出少量票","11/1 前"],
 ["已开放","酒店：补订 12/17 一晚","","10/31 前"],
 ["已开放","鲨鱼笼（12/14 早上）","选可免费改期的","11/15 前"],
 ["已开放","Kualoa 牧场 UTV（12/14 下午）","","11/15 前"],
 ["已开放","Turtle Canyon 浮潜（12/15 上午）","","11/15 前"],
 ["已开放","租车（12/13 上午 – 12/16 中午）","选可免费取消的","11/15 前"],
 ["已开放","牡丹虾晚餐（12/17）","","11/30 前"],
 ["11/13","钻石头山（12/13 早场）","提前 30 天开放","开放当天"],
 ["12/14 7:00","恐龙湾（12/16）","夏威夷时间，提前 2 天开放","开放当天"]
];
const COL={land:"#b45309",sea:"#0e7490"};
const map=L.map("map",{zoomControl:false}).setView([21.45,-157.95],10);
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";
const sat=L.layerGroup([L.tileLayer(ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Esri, Maxar, Earthstar Geographics"}),L.tileLayer(ESRI+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:18})]);
const street=L.tileLayer(ESRI+"World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Esri"});
const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"});
sat.addTo(map);
L.control.layers({"卫星":sat,"街道":street,"OpenStreetMap":osm},null,{position:"topleft",collapsed:false}).addTo(map);
L.control.zoom({position:"topright"}).addTo(map);
L.marker(HOTEL,{icon:L.divIcon({className:"",html:'<div class="pin hotel">🏨</div>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:900}).bindPopup("<b>酒店（Waikiki）</b>").addTo(map);
const layer=L.layerGroup().addTo(map);let mk=[];
const pt=k=>k==="hotel"?HOTEL:[P[k][1],P[k][2]];
const nm=k=>k==="hotel"?"酒店":P[k][0];
function tabs(){const el=document.getElementById("tabs");
  el.innerHTML=DAYS.map((d,i)=>`<button class="tab" data-i="${i}">${d.d} ${d.w}${d.car==="yes"||d.car==="pick"?'<span class="c">🚗</span>':""}</button>`).join("")+`<button class="tab" data-i="all">总览</button>`;
  el.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{show(b.dataset.i);location.hash=b.dataset.i;});}
function carBadge(c){return c==="yes"?'<span class="b car">🚗 自驾</span>':c==="pick"?'<span class="b pick">🚗 上午取车</span>':c==="opt"?'<span class="b opt">🚗 可选</span>':'<span class="b nocar">不用车</span>';}
function show(i){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.i===String(i)));
  layer.clearLayers();mk=[];const box=document.getElementById("day");document.getElementById("panel").scrollTop=0;
  if(i==="all"){overview(box);return;}
  const d=DAYS[+i];const color=COL[d.type[0]];
  const pts=d.stops.map(s=>pt(s.p));
  L.polyline(pts,{color:"#fff",weight:7,opacity:.6}).addTo(layer);
  L.polyline(pts,{color,weight:4,opacity:.95,dashArray:"8 7"}).addTo(layer);
  d.stops.forEach((s,j)=>{if(s.p==="hotel"){mk.push(null);return;}
    const m=L.marker(pt(s.p),{icon:L.divIcon({className:"",html:`<div class="pin" style="background:${color}">${j+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]})}).bindPopup(`<b>${s.t} ${nm(s.p)}</b><br>${s.txt}`).addTo(layer);mk.push(m);});
  map.flyToBounds(L.latLngBounds(pts.concat([HOTEL])).pad(.25),{duration:.8,maxZoom:14});
  let h=`<h2>${d.d} ${d.w} · ${d.title}</h2><div class="badges">${d.type.map(t=>`<span class="b ${t}">${t==="sea"?"🌊 下水":"🏔 陆地"}</span>`).join("")}${carBadge(d.car)}</div><div class="sub">${d.carNote}</div>`;
  h+=d.stops.map((s,j)=>`<div class="stop" data-j="${j}"><div class="st-h"><span class="num" style="background:${s.p==="hotel"?"#111":color}">${s.p==="hotel"?"🏨":j+1}</span><span class="t">${s.t}</span><span class="n">${nm(s.p)}</span></div><div class="st-b">${s.txt}</div>${s.bring?`<div class="bring">🎒 ${s.bring}</div>`:""}${s.warn?`<div class="warn">⚠️ ${s.warn}</div>`:""}</div>`).join("");
  h+=`<div class="foot">时间为预估，以各项预约为准。地图上的虚线表示先后顺序，不是实际行车路线。</div>`;
  box.innerHTML=h;
  box.querySelectorAll(".stop").forEach(el=>el.onclick=()=>{const j=+el.dataset.j;box.querySelectorAll(".stop").forEach(x=>x.classList.toggle("on",x===el));const m=mk[j];
    if(m){map.flyTo(m.getLatLng(),13,{duration:.6});m.openPopup();}else map.flyTo(HOTEL,14,{duration:.6});});}
function overview(box){
  DAYS.forEach(d=>{const pts=d.stops.map(s=>pt(s.p));const c=d.car==="yes"||d.car==="pick";L.polyline(pts,{color:c?"#fb7185":"#e2e8f0",weight:c?4:2.5,opacity:.9}).addTo(layer);});
  map.flyToBounds([[21.25,-158.12],[21.70,-157.68]],{duration:.8});
  box.innerHTML=`<h2>总览</h2>
  <div class="box"><h3>📅 每天安排</h3><table>${DAYS.map((d,i)=>`<tr><td style="white-space:nowrap"><a href="#${i}" onclick="show('${i}')">${d.d} ${d.w}</a></td><td>${d.type.includes("sea")?"🌊":"🏔"} ${d.title}</td><td>${carBadge(d.car)}</td></tr>`).join("")}</table></div>
  <div class="box"><h3>🚗 租车</h3>
  建议 <b>12/13 上午取车，12/16 中午还车</b>，在 Waikiki 的门店取还。12/14 早上 5:45 就要出发，门店一般还没开门，所以要提前一天取车。<br>
  <span class="sub">想再省一些：12/13 上午取车、12/15 上午还车，12/16 去恐龙湾改为打车。恐龙湾离市区较远，回程叫车可能要等。酒店停车按晚收费，两间房只需要一个车位。</span></div>
  <div class="box"><h3>🎟 预订时间表</h3><table><tr><th>开放</th><th>项目</th><th>建议订好</th></tr>${BOOK.map(b=>`<tr><td style="white-space:nowrap">${b[0]}</td><td>${b[1]}${b[2]?`<div class="sub">${b[2]}</div>`:""}</td><td style="white-space:nowrap">${b[3]}</td></tr>`).join("")}</table><div class="sub">开放时间以各官网为准。</div></div>
